<style>
:root{
  --ink:#12121A; --ink2:#1D1D28;
  --paper:#FAF8F4; --card:#FFFFFF; --card2:#F4F1EB;
  --tx:#1A1A18; --tx2:#5B5A5F; --tx3:#918F96;
  --txi:#EFEDE8; --txi2:rgba(239,237,232,.55);
  --ln:rgba(18,18,26,.09); --ln2:rgba(18,18,26,.16); --lnd:rgba(255,255,255,.09);
  --pink:#E8467A; --pink2:#FFF0F5;
  --lav:#7B6BE0; --lav2:#F1EFFD;
  --sky:#3BAFD4; --sky2:#E9F6FB;
  --lime:#6FAF3A; --lime2:#F0F7E7;
  --amb:#E0952A; --amb2:#FDF3E3;
  --red:#DC4B4B; --red2:#FDEDED;
  --sh1:0 1px 2px rgba(18,18,26,.04),0 2px 8px rgba(18,18,26,.04);
  --sh2:0 6px 24px rgba(18,18,26,.10);
  --sh3:0 16px 48px rgba(18,18,26,.16);
  --r:12px; --r2:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--tx);font-family:Inter,sans-serif;font-size:14px;min-height:100vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:Fraunces,serif;letter-spacing:-.02em}

.shell{display:flex;min-height:100vh}

/* SIDEBAR */
.side{width:236px;flex-shrink:0;background:var(--ink);color:var(--txi);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;margin-bottom:18px}
.brand-mk{width:34px;height:34px;border-radius:10px;background:var(--pink);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.brand-mk img{width:100%;height:100%;object-fit:contain;padding:5px;filter:brightness(0) invert(1)}
.brand-t1{font-family:Fraunces,serif;font-weight:600;font-size:16px;line-height:1}
.brand-t2{font-size:9.5px;color:var(--txi2);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.srch{position:relative;margin-bottom:14px}
.srch input{width:100%;height:34px;border-radius:9px;border:1px solid var(--lnd);background:rgba(255,255,255,.05);color:var(--txi);padding:0 10px 0 30px;font-size:12.5px;outline:none;font-family:Inter,sans-serif}
.srch input::placeholder{color:var(--txi2)}
.srch input:focus{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.24)}
.srch i{position:absolute;left:9px;top:9px;font-size:15px;color:var(--txi2);pointer-events:none}
.sres{position:absolute;top:40px;left:0;right:0;background:var(--ink2);border:1px solid var(--lnd);border-radius:10px;box-shadow:var(--sh3);z-index:60;max-height:270px;overflow-y:auto;padding:4px}
.sres div{display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer;font-size:12.5px;border-radius:7px}
.sres div:hover{background:rgba(255,255,255,.07)}
.sres .tg{margin-left:auto;font-size:9.5px;color:var(--txi2);text-transform:uppercase;letter-spacing:.05em}
.nsec{font-size:9.5px;color:var(--txi2);text-transform:uppercase;letter-spacing:.13em;padding:13px 10px 5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--txi2);transition:.14s;min-width:0}
.nav button i{font-size:16px;flex:0 0 auto}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--txi)}
.nav button.on{background:rgba(255,255,255,.09);color:var(--txi)}
.nav .ct{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.7;flex:0 0 auto}
.sfoot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--lnd);font-size:10px;color:var(--txi2)}

/* MAIN */
.main{flex:1;padding:32px 36px 60px;max-width:1280px;min-width:0}
.hd{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hd>div:first-child{flex:1;min-width:0}
.eyeb{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--pink);margin-bottom:6px}
h1.t{font-family:Fraunces,serif;font-weight:600;font-size:32px;margin:0 0 4px;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--tx2);font-size:14px;margin:0;max-width:560px}
.view{animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r2);padding:20px 22px;box-shadow:var(--sh1)}
.card+.card{margin-top:16px}
.ctitle{font-family:Fraunces,serif;font-weight:600;font-size:17px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.01em}
.cnt{font-family:'JetBrains Mono',monospace;font-weight:400;font-size:12px;color:var(--tx3);margin-left:5px}

.f{margin-bottom:12px}
.f label{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px;font-weight:600}
.f .hint{font-size:11px;color:var(--tx3);margin-top:4px}
.row{display:flex;gap:10px}
.row>.f{flex:1;min-width:0}
input,select,textarea{width:100%;padding:0 11px;border-radius:9px;border:1px solid var(--ln2);background:var(--card);color:var(--tx);font-family:Inter,sans-serif;font-size:13.5px;outline:none;transition:.14s}
input,select{height:38px}
textarea{padding:9px 11px;resize:vertical;min-height:60px;font-size:13px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0' fill='none' stroke='%235B5A5F' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
input[type=range]{padding:0;height:auto;border:none;box-shadow:none;accent-color:var(--pink)}
input[type=range]:focus{box-shadow:none}

.b{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.14s;white-space:nowrap}
.b:active{transform:scale(.98)}
.bp{background:var(--pink);color:#fff}
.bp:hover{background:#D13A6C}
.bg{background:var(--card);color:var(--tx);border:1px solid var(--ln2)}
.bg:hover{background:var(--card2)}
.bd{color:var(--red)}
.bs{height:31px;padding:0 12px;font-size:12.5px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ib{all:unset;cursor:pointer;width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx3);border:1px solid var(--ln2);background:var(--card);transition:.14s;flex-shrink:0}
.ib:hover{background:var(--card2);color:var(--tx)}
.ib.dg:hover{background:var(--red2);color:var(--red)}

.empty{text-align:center;padding:40px 16px;color:var(--tx3);font-size:13.5px}
.empty i{font-size:34px;color:var(--ln2);display:block;margin:0 auto 10px}

/* avatar */
.av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:600;font-size:13.5px;flex-shrink:0;color:#fff;letter-spacing:-.02em}
.av.s{width:27px;height:27px;border-radius:8px;font-size:11px}
.av.l{width:52px;height:52px;border-radius:15px;font-size:20px}
.av.c,.av.c.s,.av.c.l{border-radius:50%}
.a0{background:var(--pink)}.a1{background:var(--lav)}.a2{background:var(--sky)}
.a3{background:var(--lime)}.a4{background:var(--amb)}.a5{background:#5B8DEF}

/* pill */
.p{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;gap:4px}
.p-ok{background:var(--lime2);color:#3D6B18}
.p-w{background:var(--amb2);color:#8A5A0F}
.p-d{background:var(--red2);color:#9B2C2C}
.p-i{background:var(--sky2);color:#1C6A85}
.p-n{background:var(--lav2);color:#453BA0}
.p-g{background:var(--card2);color:var(--tx2)}

.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--card);border:1px solid var(--ln2);color:var(--tx2);transition:.14s}
.chip:hover{background:var(--card2)}
.chip.on{background:var(--ink);color:var(--txi);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ecard{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:15px 16px;box-shadow:var(--sh1);transition:.16s;cursor:pointer}
.ecard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.etop{display:flex;align-items:center;gap:10px;margin-bottom:11px;min-width:0}
.ename{font-family:Fraunces,serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esub{font-size:12px;color:var(--tx3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emeta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:11px;padding-top:11px;border-top:1px solid var(--ln)}
.eamt{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px}
.enote{font-size:10.5px;color:var(--tx3);margin-top:2px}

/* metrics */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.met{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:15px 17px;box-shadow:var(--sh1)}
.mico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px;color:#fff}
.mlab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600;margin-bottom:5px}
.mval{font-family:Fraunces,serif;font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1}
.msub{font-size:11px;color:var(--tx3);margin-top:4px}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);font-weight:600;padding:0 10px 10px;border-bottom:1px solid var(--ln)}
table.t td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover{background:var(--card2)}
table.t td.n{font-family:'JetBrains Mono',monospace}
table.t .ta{display:flex;gap:5px;justify-content:flex-end}

.lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln);gap:10px}
.lrow:last-child{border-bottom:none}
.lname{font-size:13.5px;font-weight:500}
.lsub{font-size:11.5px;color:var(--tx3);margin-top:2px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(18,18,26,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:16px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mdl{background:var(--card);border-radius:20px;max-width:720px;width:100%;padding:24px 26px 28px;box-shadow:var(--sh3);overflow-y:auto;overflow-x:hidden;max-height:calc(100dvh - 32px);min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 auto;touch-action:pan-y}
.mdl.wide{max-width:920px;max-height:calc(100dvh - 32px)}
.ov .mdl{contain:layout paint;transform:translateZ(0)}
.mhd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px}
.mid{display:flex;align-items:center;gap:13px;min-width:0}
.mtitle{font-family:Fraunces,serif;font-weight:600;font-size:21px;letter-spacing:-.02em}
.msec{margin-top:18px;padding-top:16px;border-top:1px solid var(--ln)}
.mstitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:600;margin-bottom:10px}

/* assoc */
.assoc{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card2);border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.14s}
.assoc:hover{background:var(--card);border-color:var(--ln2)}
.assoc .ai{flex:1;min-width:0}
.assoc .an{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assoc .as{font-size:11px;color:var(--tx3)}

/* simulator */
.sim{background:var(--card2);border:1px solid var(--ln);border-radius:14px;padding:16px 18px}
.simrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.simrow.tot{border-top:1px solid var(--ln2);margin-top:6px;padding-top:11px;font-weight:600;font-size:14.5px}
.simrow .v{font-family:'JetBrains Mono',monospace;font-weight:600}
.simrow.neg .v{color:var(--red)}
.simrow.pos .v{color:#3D6B18}

/* quincena grid */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.qc{border:1px solid var(--ln2);border-radius:10px;padding:9px 10px;cursor:pointer;transition:.14s;background:var(--card)}
.qc:hover{border-color:var(--pink);box-shadow:var(--sh1)}
.qc.on{background:var(--ink);color:var(--txi);border-color:var(--ink)}
.qc.pagada{background:var(--lime2);border-color:#B8DC94}
.qc.parcial{background:var(--amb2);border-color:#F0CD8E}
.qc.futura{opacity:.45}
.qcl{font-size:11.5px;font-weight:600}
.qcs{font-size:10px;color:var(--tx3);margin-top:3px;font-family:'JetBrains Mono',monospace}
.qc.on .qcs{color:var(--txi2)}

/* acordeon de quincenas */
.acc{display:flex;flex-direction:column;gap:6px}
.accit{border:1px solid var(--ln);border-radius:11px;overflow:hidden;background:var(--card)}
.acchd{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;width:100%;box-sizing:border-box;transition:.12s}
.acchd:hover{background:var(--card2)}
.acchd .chev{font-size:15px;color:var(--tx3);transition:transform .18s}
.accit.open .acchd .chev{transform:rotate(90deg)}
.accit.open .acchd{background:var(--card2);border-bottom:1px solid var(--ln)}
.accm{font-weight:600;font-size:13.5px;flex:1}
.accv{font-size:13px;font-weight:600;color:var(--tx2)}
.accbd{display:none;padding:8px}
.accit.open .accbd{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:560px){.accit.open .accbd{grid-template-columns:1fr}}
.qopt{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px 12px;border:1px solid var(--ln2);border-radius:9px;font-size:12.5px;transition:.12s}
.qopt:hover{border-color:var(--pink);background:var(--pink2)}
.qopt.on{background:var(--ink);color:var(--txi);border-color:var(--ink)}
.qopt .mono{font-weight:600}

/* nomina detail */
.ndet{border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-bottom:10px}
.nhd{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--card2);cursor:pointer}
.nhd .chev2{font-size:15px;color:var(--tx3);transition:transform .18s;flex-shrink:0}
.ndet.open .nhd .chev2{transform:rotate(90deg)}
.nbody{display:none}
.ndet.open .nbody{display:block}
.nbody{padding:4px 14px 12px;font-size:12.5px}
.nline{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.nline:last-child{border-bottom:none}

/* matriz de cobranza */
.mtxwrap{overflow-x:auto;border:1px solid var(--ln);border-radius:10px}
table.mtx{border-collapse:separate;border-spacing:0;font-size:11.5px;white-space:nowrap}
table.mtx th{background:var(--card2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--tx2);padding:7px 8px;border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln);position:sticky;top:0;z-index:3}
table.mtx th.hmes{text-align:center;background:var(--ink);color:var(--txi);border-right:1px solid rgba(255,255,255,.15)}
table.mtx th.hq{text-align:center;font-size:9.5px;min-width:74px}
table.mtx th.hcli{min-width:170px;text-align:left}
table.mtx th.hfreq{min-width:66px}
table.mtx th.hmonto{min-width:76px;text-align:right}
table.mtx td{padding:6px 8px;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln)}
table.mtx tbody tr:hover td{background:rgba(232,70,122,.04)}
table.mtx td.cli{position:sticky;left:0;background:var(--card);z-index:2;display:flex;align-items:center;gap:7px;
  font-weight:600;font-size:12.5px;cursor:pointer;min-width:170px}
table.mtx td.cli:hover{color:var(--pink)}
table.mtx td.freq{position:sticky;left:170px;background:var(--card);z-index:2;color:var(--tx3);font-size:11px}
table.mtx td.monto{text-align:right;font-weight:600}
table.mtx th.sticky-l{position:sticky;left:0;z-index:5}
table.mtx th.sticky-l2{position:sticky;left:170px;z-index:5}
table.mtx td.cel{text-align:center;font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;transition:.1s}
table.mtx td.cel:hover{outline:2px solid var(--pink);outline-offset:-2px}
table.mtx td.cel.pagada{background:#DFF0D0;color:#3D6B18}
table.mtx td.cel.vencida{background:#FBD9CE;color:#9B3A1E}
table.mtx td.cel.pendiente{background:var(--card);color:var(--tx3)}
table.mtx td.cel.fut{opacity:.5}
table.mtx td.cel.na{background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(18,18,26,.03) 4px,rgba(18,18,26,.03) 8px);color:var(--ln2);cursor:default}
table.mtx td.cel.na:hover{outline:none}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--txi);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--sh3);z-index:200;animation:tin .18s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* invoice preview */
.pvwrap{position:sticky;top:32px}
.pv{position:relative;overflow:hidden;background:#F6F4F0;border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh2);aspect-ratio:8.5/11;width:100%;padding:42px 36px;font-family:Inter,sans-serif}
.pvwm{position:absolute;left:-8%;top:26%;width:118%;opacity:.05;pointer-events:none;transform:rotate(-6deg)}
.pvlogo{width:70px;position:relative;z-index:1}
.pvinfo{position:relative;z-index:1;margin-top:16px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.6}
.pvtr{position:absolute;right:36px;top:50px;text-align:right;font-size:9.5px;z-index:1}
.pvtr div{display:flex;gap:16px;justify-content:flex-end;margin-bottom:3px}
.pvtr .l{letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);min-width:58px;text-align:left}
.pvtr .v{font-weight:700;font-family:'JetBrains Mono',monospace}
.pvtb{position:relative;z-index:1;margin-top:58px}
.pvtb .h{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:1.5px solid var(--tx);padding-bottom:7px}
.pvtb .r{display:flex;justify-content:space-between;padding:14px 0;font-size:12px;border-bottom:1px solid var(--ln)}
.pvtb .r .a{font-family:'JetBrains Mono',monospace}
.pvtb .tt{display:flex;justify-content:space-between;padding-top:14px;font-weight:700;font-size:14px}
.pvtb .tt .a{font-family:'JetBrains Mono',monospace}
.pvnote{position:absolute;left:36px;bottom:36px;font-size:10px;color:var(--tx3);z-index:1;font-style:italic}

.g2{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.g2,.g2b{grid-template-columns:1fr}}
@media(max-width:880px){
  .ov{align-items:flex-start;padding:14px 12px;}
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:relative;padding:14px 16px}
  .nav{flex-direction:row;overflow-x:auto;gap:5px}
  .nsec,.sfoot{display:none}
  .main{padding:20px 16px 40px}
  h1.t{font-size:26px}
  .pvwrap{position:static}
}

/* ================================================================
   PÁRAMO CREATIVO — MODERN UI OVERRIDES
   Visual refresh only: preserves existing HTML + JavaScript behavior.
   ================================================================ */
:root{
  --ink:#17151c;
  --ink2:#211d27;
  --paper:#f7f5f8;
  --card:#ffffff;
  --card2:#f5f2f6;
  --tx:#211e26;
  --tx2:#6f6874;
  --tx3:#9b94a0;
  --txi:#f8f5f8;
  --txi2:rgba(248,245,248,.58);
  --ln:rgba(33,30,38,.075);
  --ln2:rgba(33,30,38,.13);
  --lnd:rgba(255,255,255,.105);
  --pink:#e63f76;
  --pink2:#fff0f5;
  --lav:#7666df;
  --lav2:#f1effd;
  --sky:#3aa8cf;
  --sky2:#eaf7fb;
  --lime:#71ad43;
  --lime2:#eff8e9;
  --amb:#df922b;
  --amb2:#fff5e5;
  --red:#d94b58;
  --red2:#fdeef0;
  --sh1:0 1px 2px rgba(22,18,28,.03),0 7px 22px rgba(22,18,28,.045);
  --sh2:0 14px 38px rgba(22,18,28,.09);
  --sh3:0 24px 70px rgba(22,18,28,.18);
  --r:14px;
  --r2:20px;
}

html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 78% -10%,rgba(230,63,118,.055),transparent 30rem),
    radial-gradient(circle at 18% 100%,rgba(118,102,223,.045),transparent 26rem),
    var(--paper);
  color:var(--tx);
  letter-spacing:-.005em;
}
body::selection{background:rgba(230,63,118,.18)}

/* Sidebar */
.side{
  width:248px;
  padding:18px 13px;
  overflow-x:hidden;
  background:linear-gradient(180deg,#17151c 0%,#1b1821 100%);
  border-right:1px solid rgba(255,255,255,.055);
  box-shadow:8px 0 30px rgba(18,15,22,.055);
}
.brand{
  padding:4px 7px 15px;
  margin-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.brand-mk{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(145deg,#f15b8b,#d9366c);
  box-shadow:0 7px 18px rgba(230,63,118,.23);
}
.brand-t1{font-size:17px}
.brand-t2{font-size:9px;letter-spacing:.18em}
.srch{margin:2px 3px 13px}
.srch input{
  height:40px;border-radius:12px;
  background:rgba(255,255,255,.055);
  border-color:rgba(255,255,255,.08);
  padding-left:35px;
}
.srch input:hover{background:rgba(255,255,255,.075)}
.srch input:focus{background:rgba(255,255,255,.09);border-color:rgba(230,63,118,.65);box-shadow:0 0 0 3px rgba(230,63,118,.12)}
.srch i{left:11px;top:12px}
.nsec{padding:15px 10px 6px;font-size:9px;letter-spacing:.18em;color:rgba(248,245,248,.38)}
.nav{gap:3px}
.nav button{
  min-height:39px;padding:8px 11px;border-radius:11px;
  color:rgba(248,245,248,.59);
}
.nav button i{font-size:17px;opacity:.9}
.nav button:hover{background:rgba(255,255,255,.055);color:#fff;transform:translateX(1px)}
.nav button.on{
  background:linear-gradient(90deg,rgba(230,63,118,.17),rgba(230,63,118,.075));
  color:#fff;
  box-shadow:inset 3px 0 0 var(--pink),0 5px 16px rgba(0,0,0,.08);
}
.nav button.on i{color:#ff6b9b}
.nav .ct{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px}
.sfoot{padding:14px 10px 2px;border-top-color:rgba(255,255,255,.07)}

/* Main shell */
.main{
  max-width:none;
  padding:34px clamp(22px,4vw,58px) 70px;
}
.hd{margin-bottom:26px;align-items:center}
.eyeb{font-size:9.5px;letter-spacing:.18em;color:var(--pink);font-weight:700}
h1.t{font-size:36px;line-height:1.02;letter-spacing:-.04em}
.sub{font-size:13.5px;color:var(--tx2);line-height:1.55}

/* Cards */
.card{
  border-color:rgba(33,30,38,.075);
  border-radius:18px;
  padding:22px 23px;
  box-shadow:var(--sh1);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.card:hover{border-color:rgba(33,30,38,.11)}
.ctitle{font-size:18px;margin-bottom:16px}

/* Form controls */
.f{margin-bottom:14px}
.f label{font-size:9.5px;letter-spacing:.09em;color:#817986}
input,select,textarea{
  border-color:#e4dfe6;
  background:#fff;
  border-radius:11px;
  box-shadow:0 1px 1px rgba(20,15,25,.02);
}
input,select{height:41px}
textarea{min-height:72px}
input:hover,select:hover,textarea:hover{border-color:#d3ccd6}
input:focus,select:focus,textarea:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 4px rgba(230,63,118,.10),0 2px 5px rgba(20,15,25,.03);
}

/* Buttons */
.b{
  height:40px;border-radius:11px;padding:0 17px;
  box-shadow:0 1px 1px rgba(20,15,25,.04);
}
.bp{
  background:linear-gradient(135deg,#ec4d82,#dc396e);
  box-shadow:0 7px 18px rgba(230,63,118,.18);
}
.bp:hover{background:linear-gradient(135deg,#e94379,#ce3166);box-shadow:0 9px 22px rgba(230,63,118,.23);transform:translateY(-1px)}
.bg{border-color:#dfd9e1}
.bg:hover{background:#f8f6f8;border-color:#d2cbd5}
.ib{width:34px;height:34px;border-radius:10px;border-color:#e1dce3}
.ib:hover{box-shadow:0 5px 14px rgba(20,15,25,.07);transform:translateY(-1px)}

/* Chips / tabs */
.chips{gap:8px;margin-bottom:16px}
.chip{border-radius:10px;padding:8px 14px;background:rgba(255,255,255,.7);border-color:#e3dde5}
.chip:hover{background:#fff;transform:translateY(-1px)}
.chip.on{background:#211d27;border-color:#211d27;box-shadow:0 6px 16px rgba(33,29,39,.12)}

/* Metrics */
.mets{gap:14px;margin-bottom:20px}
.met{
  position:relative;overflow:hidden;
  border-radius:17px;padding:18px 19px;
  box-shadow:var(--sh1);
}
.met::after{
  content:"";position:absolute;right:-25px;bottom:-35px;width:100px;height:100px;
  border-radius:50%;background:currentColor;opacity:.035;pointer-events:none;
}
.mico{width:36px;height:36px;border-radius:11px}
.mval{font-size:23px!important;letter-spacing:-.04em}

/* Client cards */
.grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ecard{
  border-radius:17px;padding:17px 18px;
  box-shadow:var(--sh1);
}
.ecard:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:rgba(230,63,118,.16)}
.etop{margin-bottom:13px}

<script>
(function(){
  const ROOT_CLASS='ui-select-wrap';
  const SELECT_MARK='data-ui-select';
  function closeAll(except){
    document.querySelectorAll('.'+ROOT_CLASS+'.open').forEach(w=>{if(w!==except){w.classList.remove('open');clearMenuPosition(w)}});
  }
  function placeMenu(w){
    const trigger=w&&w.querySelector('.ui-select-trigger');
    const menu=w&&w.querySelector('.ui-select-menu');
    if(!trigger||!menu||!w.classList.contains('open'))return;
    const r=trigger.getBoundingClientRect();
    const gap=7, margin=8, maxH=Math.min(270,Math.max(120,window.innerHeight-r.bottom-margin));
    menu.style.position='fixed';
    menu.style.left=Math.round(r.left)+'px';
    menu.style.top=Math.round(r.bottom+gap)+'px';
    menu.style.right='auto';
    menu.style.width=Math.round(r.width)+'px';
    menu.style.maxHeight=Math.round(maxH)+'px';
  }
  function clearMenuPosition(w){
    const menu=w&&w.querySelector('.ui-select-menu');
    if(!menu)return;
    menu.style.position='';menu.style.left='';menu.style.top='';menu.style.right='';menu.style.width='';menu.style.maxHeight='';
  }
  function sync(w){
    const s=w&&w.querySelector('select');
    const label=w&&w.querySelector('.ui-select-label');
    const menu=w&&w.querySelector('.ui-select-menu');
    if(!s||!label||!menu)return;
    const opt=s.options[s.selectedIndex];
    label.textContent=opt?opt.text:'';
    menu.querySelectorAll('.ui-select-option').forEach(b=>b.classList.toggle('selected',Number(b.dataset.index)===s.selectedIndex));
    w.classList.toggle('disabled',!!s.disabled);
    const trigger=w.querySelector('.ui-select-trigger');
    if(trigger)trigger.setAttribute('aria-expanded',w.classList.contains('open')?'true':'false');
  }
  function build(s){
    if(!s||s.dataset[SELECT_MARK]==='1'||s.multiple||s.size>1||!s.parentNode)return;
    s.dataset[SELECT_MARK]='1';
    const wrap=document.createElement('div');wrap.className=ROOT_CLASS;
    s.parentNode.insertBefore(wrap,s);wrap.appendChild(s);
    s.classList.add('ui-native-select');
    const trigger=document.createElement('button');
    trigger.type='button';trigger.className='ui-select-trigger';trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
    trigger.innerHTML='<span class="ui-select-label"></span><span class="ui-select-chevron" aria-hidden="true"></span>';
    const menu=document.createElement('div');menu.className='ui-select-menu';menu.setAttribute('role','listbox');
    Array.from(s.options).forEach((o,i)=>{
      const b=document.createElement('button');b.type='button';b.className='ui-select-option';b.dataset.index=String(i);b.setAttribute('role','option');b.textContent=o.textContent||o.text;b.disabled=!!o.disabled;

        e.preventDefault();e.stopPropagation();
        if(b.disabled||s.disabled)return;
        s.selectedIndex=i;
        s.dispatchEvent(new Event('input',{bubbles:true}));
        s.dispatchEvent(new Event('change',{bubbles:true}));
        sync(wrap);wrap.classList.remove('open');clearMenuPosition(wrap);
      });
      menu.appendChild(b);
    });
    wrap.appendChild(trigger);wrap.appendChild(menu);
    trigger.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      if(s.disabled)return;
      const open=wrap.classList.contains('open');
      closeAll(wrap);
      if(open){
        wrap.classList.remove('open');clearMenuPosition(wrap);
      }else{
        wrap.classList.add('open');sync(wrap);placeMenu(wrap);
      }
    });
    trigger.addEventListener('keydown',e=>{
      if(e.key==='Escape'){wrap.classList.remove('open');clearMenuPosition(wrap);return;}
      if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();trigger.click();}
    });
    s.addEventListener('change',()=>sync(wrap));
    s.addEventListener('input',()=>sync(wrap));
    sync(wrap);
  }
  function upgrade(root){
    const scope=root&&root.querySelectorAll?root:document;

function avc(s){let h=0;s=s||'?';for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;return AV[Math.abs(h)%AV.length]}

/* ─── Subida de fotos ───
   La imagen se reduce y recorta en el navegador antes de guardarla, para que
   ocupe poco y la app no se vuelva lenta al cargar muchos registros. */
function comprimirFoto(file,lado){
  return new Promise((ok,fail)=>{
    if(!file||!/^image\//.test(file.type)){fail(new Error('Elige un archivo de imagen.'));return}
    if(file.size>12*1024*1024){fail(new Error('La imagen pesa demasiado (máx. 12 MB).'));return}
    const fr=new FileReader();
    fr.onerror=()=>fail(new Error('No se pudo leer el archivo.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>fail(new Error('El archivo no es una imagen válida.'));
      img.onload=()=>{
        const L=lado||320,cv=document.createElement('canvas');cv.width=cv.height=L;
        const cx=cv.getContext('2d');
        const esc2=Math.max(L/img.width,L/img.height);
        const w=img.width*esc2,h=img.height*esc2;
        cx.fillStyle='#fff';cx.fillRect(0,0,L,L);
        cx.drawImage(img,(L-w)/2,(L-h)/2,w,h);
        ok(cv.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Conecta el selector. Devuelve una función que da la foto actual. */
function fotoBind(id,inicial){
  let valor=inicial||'';
  const pv=document.getElementById(id+'-pv'),
        btn=document.getElementById(id+'-btn'),
        del=document.getElementById(id+'-del'),
        file=document.getElementById(id+'-file');
  if(!pv)return()=>valor;
  const pintar=()=>{
    pv.style.backgroundImage=valor?'url('+valor+')':'';
    pv.innerHTML=valor?'':'<i class="ti ti-photo"></i>';
    del.style.display=valor?'':'none';
  };
  btn.onclick=()=>file.click();
  del.onclick=()=>{valor='';file.value='';pintar()};
  file.onchange=async()=>{
    const f=file.files&&file.files[0];if(!f)return;
    btn.disabled=true;const t=btn.innerHTML;btn.innerHTML='Procesando…';
    try{valor=await comprimirFoto(f,320);pintar()}
    catch(err){alert(err.message||'No se pudo procesar la imagen.')}
    btn.disabled=false;btn.innerHTML=t;
  };
  return()=>valor;
}

function quincenasAnio(y){const o=[];for(let m=0;m<12;m++){const ud=new Date(y,m+1,0).getDate();const mm=String(m+1).padStart(2,'0');
o.push({key:y+'-'+mm+'-Q1',year:y,mes:m+1,mitad:1,inicio:y+'-'+mm+'-01',fin:y+'-'+mm+'-15'});
o.push({key:y+'-'+mm+'-Q2',year:y,mes:m+1,mitad:2,inicio:y+'-'+mm+'-16',fin:y+'-'+mm+'-'+ud});}return o}

return{bruto:b,comisionPct:o.comisionPct,comisionMonto:cm,neto:nt,equipo:eq,agenciaMonto:ag,agenciaPctSobreNeto:nt>0?r2(ag/nt*100):0,agenciaPctSobreBruto:b>0?r2(ag/b*100):0,bolsaEquipo:eq}}
/* Comisión: la manual del cliente manda; si no, la del método de pago */
function comisionDe(c){
  if(c.comisionPct!=null&&c.comisionPct!=='')return Number(c.comisionPct)||0;
  const m=S.metodos.find(x=>x.id===c.metodoPagoId);return m?m.comisionPct:0}
/* Asignaciones manuales:
   - modo normal: {memberId, monto} = monto mensual fijo por cliente (esquema anterior)
   - modo comisión: {memberId, modo:'comision', comisionPct} = porcentaje del cliente que se suma al sueldo
*/
function asigsDe(c){
  return (c.asignaciones||[]).filter(a=>{
    if(!a.memberId||a.activo===false)return false;
    const m=memberById(a.memberId);
    if(!m)return false;
    // Las asignaciones por comisión pueden existir para cualquier tipo de empleado.
    // En sueldo fijo se suman al sueldo; en mixto también.
    if(a.modo==='comision')return (Number(a.comisionPct)||0)>0;
    // Un sueldo fijo no se imputa por monto a clientes; solo puede tener su sueldo base
    // y, opcionalmente, comisiones porcentuales.
    if(m.tipoCompensacion==='sueldo')return false;
    // Por cliente: conserva el esquema original de monto mensual.
    return (Number(a.monto)||0)>0;
  })
}
function comisionAsignacionDe(c,a){
  if(!a||a.modo!=='comision')return 0;
  return r2((Number(c.tarifaBruta)||0)*(Number(a.comisionPct)||0)/100);
}
function montoAsignacionMensual(c,a){
  if(!a)return 0;
  return a.modo==='comision'?comisionAsignacionDe(c,a):r2(Number(a.monto)||0);
}
function costoEquipoDe(c){return r2(asigsDe(c).reduce((s,a)=>s+montoAsignacionMensual(c,a),0))}
/* Cascada automática: bruto → comisión de cobro → neto → costos variables de cliente → margen bruto de agencia. Los sueldos fijos van aparte. */
function cascadaCliente(c){
  const bruto=r2(c.tarifaBruta),cp=comisionDe(c);
  const com=r2(bruto*(cp/100)),neto=r2(bruto-com);
  const equipo=costoEquipoDe(c),agencia=r2(neto-equipo);
  return{bruto,comisionPct:cp,comisionMonto:com,neto,equipo,agencia,
    agenciaPct:neto>0?r2((agencia/neto)*100):0,alcanza:equipo<=neto+0.005};
}
function asigDeMiembro(c,memberId){
  const a=asigsDe(c).find(x=>x.memberId===memberId);
  return montoAsignacionMensual(c,a);

}

/* Distribución secuencial de cobros para nómina. */
function cobroNominaCliente(c,q){
  if(!c||!q)return{pagos:[],totalBruto:0,pagado:false,totalMes:0,base:Number(c&&c.tarifaBruta)||0,saldoInicial:0};
  const mensualBase=r2(Number(c.tarifaBruta)||0);if(mensualBase<=0)return{pagos:[],totalBruto:0,pagado:false,totalMes:0,base:0,saldoInicial:0};
  const qBase=r2(mensualBase*0.5),mi=q.year+'-'+String(q.mes).padStart(2,'0')+'-01',mf=q.year+'-'+String(q.mes).padStart(2,'0')+'-'+q.fin.slice(8);
  const ps=cobrosEnControl(S.cobros).filter(p=>p.companyId===c.id);
  let asignado=0,totalMes=0;
  ps.forEach(p=>{
    const bruto=r2(Number(p.montoBruto)||0);
    if(String(p.fecha||'').slice(0,7)===mi)totalMes=r2(totalMes+bruto);
    if(Array.isArray(p.aplicaciones)&&p.aplicaciones.length){
      const ap=p.aplicaciones.find(a=>a.quincenaKey===q.key);
      if(ap)asignado=r2(asignado+(Number(ap.monto)||0));
    }else if(String(p.fecha||'')>=q.inicio&&String(p.fecha||'')<=q.fin){
      /* Compatibilidad con cobros antiguos sin asignación explícita. */
      asignado=r2(Math.min(qBase,asignado+bruto));
    }
  });
  const key=c.id+'|'+q.key;
  const saldoInicial=r2(Math.max(0,Math.min(qBase,Number((S.nominaSaldosIniciales||{})[key])||0)));
  asignado=r2(Math.min(qBase,asignado+saldoInicial));
  return{pagos:ps,totalBruto:asignado,pagado:asignado>0,totalMes:r2(totalMes+saldoInicial),base:qBase,saldoInicial};
}

function adelantosPendientesMiembro(memberId,untilDate){

  const usados=adelantosAplicadosAntesDe(memberId,untilDate);

function distribuirDescuentoAdelantos(memberId,untilDate,monto){
  let restante=r2(Math.max(0,monto)),out=[];
  const avances=adelantosGeneralesDeMiembro(memberId).filter(a=>String(a.fecha||'')<=untilDate);
  const usados=adelantosAplicadosAntesDe(memberId,untilDate);
  for(const a of avances){
    if(restante<=0.005)break;
    const disponible=r2(Math.max(0,(Number(a.monto)||0)-(usados[a.id]||0)));
    if(disponible<=0)continue;
    const tomar=r2(Math.min(disponible,restante));
    if(tomar>0){out.push({advanceId:a.id,monto:tomar});restante=r2(restante-tomar)}
  }

function calcularNomina(q){
  const porMiembro=(isAdminUser()?S.members:S.members.filter(m=>m.id===linkedMemberId())).filter(m=>m.activo).map(m=>{
    const rol=S.roles.find(x=>x.id===m.roleId),det=[],quincenaDisponible=q.inicio<=today();
    const sueldoBase=(quincenaDisponible&&(m.tipoCompensacion==='sueldo'||m.tipoCompensacion==='mixto'))?r2((Number(m.sueldoMensual)||0)/2):0;
    const sueldoYaPagado=sueldoYaPagadoEnQ(m.id,q), sueldoPendiente=r2(Math.max(0,sueldoBase-sueldoYaPagado));
    S.companies.filter(c=>c.estado==='activo').forEach(c=>{
      const asign=asigDeMiembroRaw(c,m.id);if(!asign)return;const mensual=asigDeMiembro(c,m.id);if(mensual<=0)return;const mq=r2(mensual*0.5),cb=cobroNominaCliente(c,q),clientePeriodo=r2((Number(c.tarifaBruta)||0)*0.5);
      const pctCobrado=quincenaDisponible&&clientePeriodo>0?Math.max(0,Math.min(1,cb.totalBruto/clientePeriodo)):0,ganado=quincenaDisponible?r2(mq*pctCobrado):0;
      const pagosQ=pagosNominaDeMiembroEnQ(m.id,q.key);
      const yaPagadoCliente=r2(pagosQ.reduce((sum,p)=>{const z=(p.detalle||[]).find(d=>d.companyId===c.id||d.negocio===c.negocio);return sum+(z?Number(z.pagable)||0:0)},0));
      const pagable=r2(Math.max(0,ganado-yaPagadoCliente));
      const retenido=r2(Math.max(0,mq-Math.max(ganado,yaPagadoCliente)));
      det.push({companyId:c.id,negocio:c.negocio,montoMes:mensual,montoQuincena:mq,modo:asign.modo==='comision'?'comision':'monto',comisionPct:asign.modo==='comision'?Number(asign.comisionPct)||0:0,clientePago:cb.pagado,cobrado:cb.totalBruto,cobradoAcumulado:cb.totalMes,porcentajeCobrado:pctCobrado,ganado,pagable,yaPagadoCliente,retenido});
    });
    const dc=r2(det.reduce((x,d)=>x+d.montoQuincena,0)),pc=r2(det.reduce((x,d)=>x+d.pagable,0)),rt=r2(det.reduce((x,d)=>x+d.retenido,0));
    const totalAntesAdelantos=r2(sueldoPendiente+pc), adelantosSueltos=adelantosPendientesMiembro(m.id,q.fin);
    const totalPagable=r2(Math.max(0,totalAntesAdelantos));
    return{memberId:m.id,nombre:m.nombre,rol:rol?rol.nombre:'',tipoCompensacion:m.tipoCompensacion,sueldoBase,sueldoYaPagado,sueldoPendiente,detalle:det,devengadoClientes:dc,pagableClientes:pc,retenido:rt,adelantosClientes:0,adelantosSueltos,totalDevengado:r2(sueldoBase+dc),totalAntesAdelantos,totalPagable,porPagar:totalPagable,numClientes:det.length,quincenaDisponible};
  });
  return{quincena:q,porMiembro,totales:{devengado:r2(porMiembro.reduce((s,x)=>s+x.totalDevengado,0)),pagable:r2(porMiembro.reduce((s,x)=>s+x.totalAntesAdelantos,0)),retenido:r2(porMiembro.reduce((s,x)=>s+x.retenido,0)),yaPagado:r2(porMiembro.reduce((s,x)=>s+x.sueldoYaPagado,0)),porPagar:r2(porMiembro.reduce((s,x)=>s+x.totalAntesAdelantos,0))}}}

function isAdminUser(){
  const u=currentUser();
  if(!u)return false;
  // El usuario "admin" es siempre el administrador principal.
  // Esto evita que datos guardados de versiones anteriores dejen al admin en modo consulta.
  if(String(u.usuario||'').trim().toLowerCase()==='admin')return true;
  const r=roleById(u.roleId);
  return !!(r&&/admin|administrador/i.test(r.nombre||''));
}
function linkedMemberId(){const u=currentUser();return u&&u.memberId?u.memberId:null}
function canSeeCompanyId(companyId){

}

function allPerms(){const o={};TAB_PERMS.forEach(([k])=>o[k]=true);return o}
function defaultRolePerms(name){
  if(/admin|administrador/i.test(name||''))return allPerms();
  return allPerms();
}
function ensureRolePerms(){
  S.roles.forEach(r=>{if(!r.permisos)r.permisos=defaultRolePerms(r.nombre)});
}
function ensureUsers(){
  let changed=false;
  let adminRole=S.roles.find(r=>/admin|administrador/i.test(r.nombre));
  if(!adminRole){
    adminRole={id:uid(),nombre:'Administrador',permisos:allPerms()};
    S.roles.unshift(adminRole);
    changed=true;
  }else if(!adminRole.permisos || Object.keys(adminRole.permisos).length<TAB_PERMS.length){
    adminRole.permisos=allPerms();
    changed=true;
  }

  if(!S.users.length){
    S.users=[{id:uid(),nombre:'Administrador',usuario:'admin',email:'',
      roleId:adminRole.id,memberId:null,activo:true}];
    return true;
  }

  // Recupera el usuario admin creado en una versión anterior y lo vuelve a enlazar
  // con el rol Administrador para que conserve acceso total.
  const adminUser=S.users.find(u=>String(u.usuario||'').trim().toLowerCase()==='admin');
  if(adminUser){
    if(adminUser.roleId!==adminRole.id){adminUser.roleId=adminRole.id;changed=true}
    if(adminUser.activo===false){adminUser.activo=true;changed=true}
  }
  return changed;
}
async function logout(){
  S.sessionUserId=null;
  try{await sb.auth.signOut()}catch(e){}
  location.reload();
}

  const er=()=>document.getElementById('lg-err');
  const showErr=t=>{const e=er();e.textContent=t;e.style.display='block'};
  const login=async()=>{
    const email=document.getElementById('lg-u').value.trim(),pw=document.getElementById('lg-p').value;
    const btn=document.getElementById('lg-in');
    if(!email||!pw){showErr('Ingresa tu correo y contraseña.');return}

    try{
      const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error){showErr('Correo o contraseña incorrectos.');btn.disabled=false;btn.textContent='Entrar';return}
      document.querySelectorAll('.ov.login-layer').forEach(e=>e.remove());
      S.loading=true;
      /* No llamamos a render() aquí: en este punto la sesión de Supabase ya
         existe, pero S.sessionUserId todavía no se ha vinculado (eso pasa
         dentro de bootData). Si renderizáramos ahora, currentUser() seguiría
         devolviendo falso y render() volvería a crear el modal de login por
         su cuenta — quedando pegado encima del panel una vez bootData
         termina de cargar los datos y sí reconoce la sesión. */
      if(data&&data.user){await bootData(data.user)}else{await boot()}
    }catch(e){
      showErr('No se pudo conectar con el servidor. Revisa tu conexión.');
      btn.disabled=false;btn.textContent='Entrar';
    }
  };
  document.getElementById('lg-in').onclick=login;
  document.getElementById('lg-p').onkeydown=e=>{if(e.key==='Enter')login()};
  document.getElementById('lg-u').focus();
}

/* ═══════════ SEGURIDAD: SOLO ADMIN PUEDE MODIFICAR ═══════════
   Los usuarios no administradores pueden consultar la información,
   navegar y cerrar ventanas, pero no pueden crear, editar, eliminar,
   registrar pagos/cobros ni cambiar configuraciones.
*/
function enforceReadOnly(){
  const admin=isAdminUser();
  document.body.classList.toggle('readonly-user',!admin);
  if(admin)return;

  // Campos de la aplicación: visibles y copiables, pero no editables.
  document.querySelectorAll('body:not(.login-layer) input, body:not(.login-layer) select, body:not(.login-layer) textarea')
    .forEach(el=>{
      if(el.closest('.login-layer'))return;
      if(el.classList.contains('srch') || el.closest('.srch'))return;
      if(el.type==='range')el.disabled=true;
      else if(el.tagName==='SELECT')el.disabled=true;
      else el.readOnly=true;
    });
}

/* Bloquea cualquier botón que pueda disparar una mutación.
   Se conservan navegación, filtros, acordeones y cierre de modales. */
document.addEventListener('click',function(e){
  if(isAdminUser())return;
  const b=e.target.closest('button');
  if(!b || b.closest('.login-layer'))return;

  const id=(b.id||'').toLowerCase();
  const allowIds=new Set([
    'logout','go-nom','go-w','e-cancel','c-cancel','w-cancel','m-cancel',
    'ep-cancel','uc','rc','pp-cancel','g-cancel','ac-cancel',
    'x','ux','mc-x','mw-x','mm-x','me-x','eg-x','pc-x'
  ]);

  // Navegación/filtros que solo cambian la vista, no los datos.
  const viewOnly =
    b.closest('.nav') ||
    b.classList.contains('chip') ||
    b.classList.contains('qc') ||
    b.classList.contains('acchd') ||
    b.classList.contains('nhd') ||
    /^([a-z]+-)?(prev|next|left|right)$/.test(id) ||
    id==='ly-' || id==='cy-' || id==='y-' ||
    allowIds.has(id);

  // Botones de consulta/cierre no escriben datos.
  const harmless =
    b.classList.contains('modal-close') ||
    b.dataset.pdfpay !== undefined ||
    b.dataset.pdf !== undefined;

  if(viewOnly || harmless)return;

  // Cualquier otro botón de la aplicación queda bloqueado para no-admin.
  if(b.classList.contains('b') || b.dataset.uedit || b.dataset.udel ||
     b.dataset.redit || b.dataset.rdel || b.dataset.delpay ||
     b.dataset.dk || b.dataset.unlink || b.dataset.ul ||
     b.dataset.dp || b.dataset.di || b.dataset.de ||
     b.dataset.cv || b.dataset.pay || b.dataset.editpay ||
     b.dataset.adv){
    e.preventDefault();
    e.stopImmediatePropagation();
    alert('Solo el administrador puede modificar la información.');
  }
},true);

document.addEventListener('drop',function(e){
  if(!isAdminUser()){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
},true);

async function pagarGastoFijo(id,ym){
  const g=(S.gastosFijos||[]).find(x=>x.id===id);if(!g)return;
  if(pagoFijoDelMes(g,ym)){alert('Este gasto ya está marcado como pagado para este mes.');return}
  const fecha=fechaVencimientoFijo(g,ym),w=walletById(g.walletId);
  if(!w){alert('Selecciona una wallet para este gasto fijo.');return}
  const sw=saldoWallet(w.id,today()),disponible=r2(sw.saldo);
  if(disponible+0.005<Number(g.monto)){alert('La wallet seleccionada no tiene saldo suficiente.');return}
  const e={id:uid(),fecha,categoria:g.categoria||'General',descripcion:g.nombre,monto:r2(g.monto),walletId:g.walletId,fijoId:g.id,periodo:ym,esGastoFijo:true};
  S.egresos.push(e);await save('egresos');toast('Gasto fijo marcado como pagado');render();
}

/* ─────────── PROYECCIÓN FINANCIERA ─────────── */
function proyeccionBase(){
  const act=(S.companies||[]).filter(c=>c.estado==='activo');
  let ingresos=0,comisionesCobro=0,equipoVariable=0;
  act.forEach(c=>{
    const bruto=r2(Number(c.tarifaBruta)||0); const cp=comisionDe(c); const cob=r2(bruto*cp/100);
    ingresos=r2(ingresos+bruto); comisionesCobro=r2(comisionesCobro+cob); equipoVariable=r2(equipoVariable+costoEquipoDe(c));
  });
  const sueldosFijos=r2((S.members||[]).filter(m=>m.activo&&(m.tipoCompensacion==='sueldo'||m.tipoCompensacion==='mixto')).reduce((s,m)=>s+(Number(m.sueldoMensual)||0),0));
  const gastosFijos=r2((S.proyeccionGastosFijos||[]).reduce((s,g)=>s+(Number(g.monto)||0),0));
  const margenBruto=r2(ingresos-comisionesCobro-equipoVariable);
  const utilidad=r2(margenBruto-sueldosFijos-gastosFijos);
  return{clientes:act.length,ingresos,comisionesCobro,equipoVariable,sueldosFijos,gastosFijos,margenBruto,utilidad};
}

      if(!S.members.length){ael.innerHTML='<div style="font-size:12.5px;color:var(--tx3)">Agrega miembros primero en Equipo.</div>';return}
      ael.innerHTML=asigs.map((a,i)=>{
        const m2=memberById(a.memberId);
        const tipo=(m2&&m2.tipoCompensacion)||'porCliente';
        const esCom=a.modo==='comision';
        const esMixto=tipo==='mixto';

        return '<div class="assoc" style="cursor:default;flex-wrap:wrap" data-ai="'+i+'">'+av(m2?m2.nombre:'?','s',1)+
        '<select class="as-m" style="flex:1;min-width:145px"><option value="">— Elegir —</option>'+

        row.querySelector('.as-m').onchange=e=>{
          const nm=memberById(e.target.value);
          asigs[i].memberId=e.target.value;
          if(nm&&nm.tipoCompensacion==='mixto'){asigs[i].modo='comision';asigs[i].comisionPct=Number(asigs[i].comisionPct)||0;delete asigs[i].monto}
          else if(nm&&nm.tipoCompensacion==='porCliente'){delete asigs[i].modo;delete asigs[i].comisionPct;asigs[i].monto=Number(asigs[i].monto)||0}
          else {asigs.splice(i,1)}
          drawAsig();drawSim();
        };
        const vv=row.querySelector('.as-v'); if(vv)vv.oninput=e=>{asigs[i].monto=Number(e.target.value)||0;drawSim()};
        const pp=row.querySelector('.as-pct'); if(pp)pp.oninput=e=>{asigs[i].comisionPct=Number(e.target.value)||0;drawSim()};
        row.querySelector('.as-on').onchange=e=>{asigs[i].activo=e.target.checked;drawSim()};
        row.querySelector('.as-x').onclick=()=>{asigs.splice(i,1);drawAsig();drawSim()};
      });
    }
    function drawSim(){
      const bruto=Number(document.getElementById('e-tar').value)||0;
      const cm=document.getElementById('e-com').value;
      const met=S.metodos.find(x=>x.id===document.getElementById('e-met').value);
      const cp=cm!==''?Number(cm)||0:(met?met.comisionPct:0);
      const com=r2(bruto*cp/100),neto=r2(bruto-com);
      const eq=r2(asigs.reduce((s,a)=>s+montoAsignacionMensual(c,{...a,memberId:a.memberId}),0));
      const ag=r2(neto-eq);
      let h='<div class="simrow"><span>Bruto del cliente</span><span class="v">'+money(bruto)+'</span></div>'+
        '<div class="simrow neg"><span>Comisión '+pct(cp)+(cm!==''?' (manual)':'')+'</span><span class="v">−'+money(com)+'</span></div>'+
        '<div class="simrow"><span>Neto recibido</span><span class="v">'+money(neto)+'</span></div>';
      asigs.filter(a=>a.memberId&&montoAsignacionMensual(c,a)>0).forEach(a=>{
        const m2=memberById(a.memberId);
        const etiqueta=a.modo==='comision'?pct(a.comisionPct)+' comisión':'monto mensual';
        h+='<div class="simrow neg"><span style="padding-left:12px">'+esc(m2?m2.nombre:'?')+' · '+etiqueta+'</span><span class="v">−'+money(montoAsignacionMensual(c,a))+'</span></div>'});
      h+='<div class="simrow tot '+(ag<0?'neg':'pos')+'"><span>Margen bruto de agencia</span><span class="v">'+money(ag)+'</span></div>';
      if(ag<0)h+='<div class="simrow"><span style="color:var(--red);font-size:12px">Estás repartiendo más de lo que entra</span><span></span></div>';
      else h+='<div class="simrow"><span style="color:var(--tx3)">Margen de agencia sobre el bruto</span><span class="v" style="color:var(--tx2)">'+(bruto>0?pct(r2(ag/bruto*100)):'—')+'</span></div>';
      document.getElementById('sim').innerHTML=h;
    }
    document.getElementById('asig-add').onclick=()=>{asigs.push({memberId:'',monto:0});drawAsig();drawSim()};
    ['e-tar','e-com'].forEach(id=>document.getElementById(id).oninput=drawSim);
    document.getElementById('e-met').onchange=drawSim;
    drawAsig();drawSim();
    const getFotoEmpresa=fotoBind('e-foto',c.foto);
    document.querySelectorAll('#e-servs .chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));

    document.getElementById('e-save').onclick=async()=>{
      const neg=document.getElementById('e-neg').value.trim();
      if(!neg){alert('Ponle nombre al negocio.');return}
      const cm=document.getElementById('e-com').value;
      const gv=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
      const gn=id=>{const el=document.getElementById(id);if(!el||el.value==='')return null;return Number(el.value)||0};
      const patch={negocio:neg,ubicacion:document.getElementById('e-ubi').value.trim(),
        foto:getFotoEmpresa(),
        industria:gv('e-ind'),web:gv('e-web'),
        servicios:Array.from(document.querySelectorAll('#e-servs .chip.on')).map(b=>b.dataset.sv),
        postsMes:gn('e-pubs'),reelsMes:gn('e-reels'),historiasMes:gn('e-hist'),
        presupuestoAds:gn('e-ads'),diaEntrega:gn('e-dent'),
        instagram:gv('e-ig'),facebook:gv('e-fb'),tiktok:gv('e-tk'),
        carpetaDrive:gv('e-drive'),tono:gv('e-tono'),publico:gv('e-publico'),
        notasInternas:gv('e-notas'),
        tarifaBruta:Number(document.getElementById('e-tar').value)||0,
        metodoPagoId:document.getElementById('e-met').value,
        comisionPct:cm===''?null:Number(cm)||0,
        frecuencia:document.getElementById('e-fr').value,
        diaCobro:Number(document.getElementById('e-dia').value)||5,
        estado:document.getElementById('e-est').value,
        fechaInicio:document.getElementById('e-fi').value,
        ultimaFechaPago:c.ultimaFechaPago||'',proximaFechaPago:c.proximaFechaPago||'',
        asignaciones:asigs.filter(a=>{
          const mm=memberById(a.memberId);
          if(!mm||mm.tipoCompensacion==='sueldo'||a.memberId==='')return false;
          if(mm.tipoCompensacion==='mixto')return a.modo==='comision'&&(Number(a.comisionPct)||0)>0;
          return (Number(a.monto)||0)>0;
        }).map(a=>{
          const x={memberId:a.memberId,activo:a.activo!==false};
          if(a.modo==='comision'){x.modo='comision';x.comisionPct=Number(a.comisionPct)||0}
          else{x.monto=Number(a.monto)||0}
          return x;
        }),
        equipoIds:asigs.filter(a=>{const mm=memberById(a.memberId);return mm&&mm.tipoCompensacion!=='sueldo'&&a.memberId&&montoAsignacionMensual(c,a)>0}).map(a=>a.memberId)};
      if(isNew){const nc={id:uid(),...patch,notas:[]};S.companies.push(nc);S.mCompany=nc.id;toast('Empresa creada')}
      else{Object.assign(c,patch);toast('Guardado')}
      S.eCompany=null;await save('companies');render();
    };
    document.getElementById('e-cancel').onclick=()=>{if(isNew){S.mCompany=null}S.eCompany=null;render()};
    return;
  }

  document.getElementById('a-cob').onclick=()=>{S.mCompany=null;S.tab='cobros';S.presetCompany=c.id;render()};
  document.getElementById('a-fac').onclick=()=>{S.mCompany=null;S.tab='facturas';S.presetCompany=c.id;render()};

    S.companies=S.companies.filter(x=>x.id!==c.id);S.links=S.links.filter(l=>l.companyId!==c.id);

  };
  m.querySelectorAll('[data-mem]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('button'))return;S.mCompany=null;S.mMember=e.dataset.mem;render()});
  m.querySelectorAll('[data-ct]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('button'))return;S.mCompany=null;S.mContact=e.dataset.ct;render()});

    S.links=S.links.filter(l=>l.id!==b.dataset.unlink);await save('links');render()});

function simRows(cs,company){
  let h='<div class="simrow"><span>Bruto del cliente</span><span class="v">'+money(cs.bruto)+'</span></div>'+
    '<div class="simrow neg"><span>Comisión '+pct(cs.comisionPct)+'</span><span class="v">−'+money(cs.comisionMonto)+'</span></div>'+
    '<div class="simrow"><span>Neto recibido</span><span class="v">'+money(cs.neto)+'</span></div>';
  if(company){asigsDe(company).forEach(a=>{const m=memberById(a.memberId);
    h+='<div class="simrow neg"><span style="padding-left:12px">'+esc(m?m.nombre:'?')+'</span><span class="v">−'+money(a.monto)+'</span></div>'})}
  else if(cs.equipo>0)h+='<div class="simrow neg"><span>Al equipo</span><span class="v">−'+money(cs.equipo)+'</span></div>';
  h+='<div class="simrow tot '+(cs.agencia<0?'neg':'pos')+'"><span>Margen bruto de agencia</span><span class="v">'+money(cs.agencia)+'</span></div>';
  h+='<div class="simrow"><span style="color:var(--tx3)">Margen bruto de agencia sobre el bruto</span><span class="v" style="color:var(--tx2)">'+(cs.bruto>0?pct(r2(cs.agencia/cs.bruto*100)):'—')+'</span></div>';
  return h;
}

function csvEsc(s){s=s==null?'':String(s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function expCSV(){

function parseCSV(t){const rows=[];let cur=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"'){q=false}else f+=c}
    else{if(c==='"')q=true;else if(c===','){cur.push(f);f=''}else if(c==='\n'){cur.push(f);rows.push(cur);cur=[];f=''}else if(c!=='\r')f+=c}}
  if(f.length||cur.length){cur.push(f);rows.push(cur)}
  return rows.filter(r=>r.some(v=>v&&v.trim()))}
async function impCSV(txt){
  const rows=parseCSV(txt);if(rows.length<2){alert('El archivo no tiene datos.');return}
  const H=rows[0].map(h=>h.trim());
  const ix=names=>{for(const n of names){const i=H.findIndex(h=>h.toLowerCase()===n.toLowerCase());if(i!==-1)return i}return -1};
  const iN=ix(['Name']),iG=ix(['Given Name','First Name','Nombre']),iF=ix(['Family Name','Last Name','Apellido']),
    iE=ix(['E-mail 1 - Value','Email','E-mail']),iP=ix(['Phone 1 - Value','Phone','Teléfono','Telefono']),
    iO=ix(['Organization 1 - Name','Organization','Empresa','Company']),iT=ix(['Organization 1 - Title','Cargo','Title']);
  let nuevos=0,act=0,emp=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    let g=iG>=0?(r[iG]||'').trim():'',fa=iF>=0?(r[iF]||'').trim():'';
    const fn=iN>=0?(r[iN]||'').trim():'';
    if(!g&&!fa&&fn){const p=fn.split(/\s+/);g=p.shift()||'';fa=p.join(' ')}
    const em=iE>=0?(r[iE]||'').trim().split(/\s*:::\s*/)[0]:'';
    const tel=iP>=0?(r[iP]||'').trim().split(/\s*:::\s*/)[0]:'';
    const org=iO>=0?(r[iO]||'').trim():'';const rol=iT>=0?(r[iT]||'').trim():'';
    if(!g&&!fa&&!em&&!tel)continue;
    let ex=em?S.contacts.find(x=>x.email&&x.email.toLowerCase()===em.toLowerCase()):null;
    if(!ex&&(g||fa))ex=S.contacts.find(x=>(x.nombre||'').toLowerCase()===g.toLowerCase()&&(x.apellido||'').toLowerCase()===fa.toLowerCase());
    let cid=null;
    if(org){let co=S.companies.find(x=>x.negocio.toLowerCase()===org.toLowerCase());
      if(!co){co={id:uid(),negocio:org,ubicacion:'',tarifaBruta:0,metodoPagoId:(S.metodos[0]||{}).id,
        estado:'activo',frecuencia:'mensual',diaCobro:5,equipoIds:[],pesos:{},notas:[],fechaInicio:today()};
        S.companies.push(co);emp++}
      cid=co.id}
    if(ex){if(!ex.nombre&&g)ex.nombre=g;if(!ex.apellido&&fa)ex.apellido=fa;
      if(!ex.email&&em)ex.email=em;if(!ex.telefono&&tel)ex.telefono=tel;
      if(cid)linkContact(ex.id,cid,rol||'Contacto');act++}
    else{const nc={id:uid(),nombre:g,apellido:fa,email:em,telefono:tel,notas:[]};S.contacts.push(nc);
      if(cid)linkContact(nc.id,cid,rol||'Contacto');nuevos++}
  }
  await save('contacts');await save('companies');await save('links');
  toast(nuevos+' nuevos · '+act+' actualizados · '+emp+' empresas');render();
}

function estadoCuentaCliente(c){

  const totalFacturado=r2(S.invoices.filter(i=>i.companyId===c.id).reduce((s,i)=>s+invoiceTotal(i),0));

}

/* ¿A este cliente le toca cobrar en esta quincena? */
function aplicaQuincena(c,q){
  // Antes de ser cliente, no aplica
  const desde=c.fechaInicio||today().slice(0,7)+'-01';
  if(q.fin<desde)return false;
  if(c.frecuencia==='quincenal')return true;
  // Mensual: cae en la quincena que contiene su día de cobro
  const d=c.diaCobro||5;
  return q.mitad===(d<=15?1:2);
}
function estadoCelda(companyId,q){
  const c=companyById(companyId);
  if(!c||!aplicaQuincena(c,q))return'na';
  const ov=(S.calendario||{})[companyId+'|'+q.key];
  if(ov)return ov;
  const p=pagoEnPeriodo(companyId,q.inicio,q.fin);
  if(p.pagado)return'pagada';
  return today()>q.fin?'vencida':'pendiente';
}

/* ─────────── WALLETS ─────────── */
const WCOL=['#3BAFD4','#6FAF3A','#E0952A','#7B6BE0','#E8467A','#5B8DEF'];
function walletById(id){return S.metodos.find(m=>m.id===id)}
/* Nombre completo de la wallet: "Zelle · María" cuando hay titular. */
function walletLabel(w){
  if(!w)return'—';
  return w.titular?w.nombre+' · '+w.titular:w.nombre;
}
function saldoWallet(wid,hasta){
  const w=walletById(wid);if(!w)return{inicial:0,entradas:0,comisiones:0,salidas:0,saldo:0,movs:[]};
  const ini=Number(w.saldoInicial)||0;
  const movs=[];let ent=0,com=0,sal=0;
  S.cobros.filter(p=>p.metodoPagoId===wid&&(!hasta||p.fecha<=hasta)).forEach(p=>{
    const cp=p.comisionPct!=null?Number(p.comisionPct):(w.comisionPct||0);
    const b=Number(p.montoBruto)||0,cm=r2(b*cp/100),nt=r2(b-cm);
    ent+=nt;com+=cm;
    const co=companyById(p.companyId);
    movs.push({fecha:p.fecha,tipo:'cobro',desc:(co?co.negocio:'Cobro')+(cm>0?' · comisión '+money(cm):''),monto:nt});
  });
  S.payouts.filter(p=>(p.walletId||null)===wid&&(!hasta||p.fecha<=hasta)).forEach(p=>{
    const m=memberById(p.memberId);const mo=Number(p.monto)||0;sal+=mo;
    movs.push({fecha:p.fecha,tipo:'nomina',desc:'Pago a '+(m?m.nombre:'equipo'),monto:-mo});
  });
  S.egresos.filter(e=>(e.walletId||null)===wid&&(!hasta||e.fecha<=hasta)).forEach(e=>{
    const mo=Number(e.monto)||0;sal+=mo;
    movs.push({fecha:e.fecha,tipo:'gasto',desc:e.descripcion||e.categoria,monto:-mo});
  });
  /* Entregas: cuando el titular de la wallet te hace llegar el dinero.
     Sale de su wallet y, si indicaste destino, entra en la otra. */
  (S.entregas||[]).filter(e=>e.walletId===wid&&(!hasta||e.fecha<=hasta)).forEach(e=>{
    const mo=Number(e.monto)||0;sal+=mo;
    const d=e.destinoId?walletById(e.destinoId):null;
    movs.push({fecha:e.fecha,tipo:'entrega',desc:'Entrega'+(d?' \u2192 '+d.nombre:'')+(e.nota?' \u00b7 '+e.nota:''),monto:-mo});
  });
  (S.entregas||[]).filter(e=>e.destinoId===wid&&(!hasta||e.fecha<=hasta)).forEach(e=>{
    const mo=Number(e.monto)||0;ent+=mo;
    const o=walletById(e.walletId);
    movs.push({fecha:e.fecha,tipo:'entrega',desc:'Recibido de '+(o?(o.titular||o.nombre):'otra wallet'),monto:mo});
  });
  movs.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return{inicial:ini,entradas:r2(ent),comisiones:r2(com),salidas:r2(sal),saldo:r2(ini+ent-sal),movs};
}

  head(v,'Dinero','Wallets','Cada medio de cobro con su comisión y su saldo real.',
    '<button class="b bp" id="nw"><i class="ti ti-plus"></i>Nueva wallet</button>');
  if(!S.metodos.length){v.appendChild(frag(mt('ti-wallet','Crea tu primera wallet.')));}
  else{
    const tot=S.metodos.reduce((s,w)=>s+saldoWallet(w.id).saldo,0);
    const totC=S.metodos.reduce((s,w)=>s+saldoWallet(w.id).comisiones,0);
    v.appendChild(frag('<div class="mets">'+
      '<div class="met"><div class="mico" style="background:var(--ink)"><i class="ti ti-wallet"></i></div><div class="mlab">Saldo total</div><div class="mval" style="color:'+(tot>=0?'var(--lime)':'var(--red)')+'">'+money(tot)+'</div><div class="msub">en '+S.metodos.length+' wallets</div></div>'+
      '<div class="met"><div class="mico" style="background:var(--amb)"><i class="ti ti-percentage"></i></div><div class="mlab">Comisiones pagadas</div><div class="mval">'+money(totC)+'</div><div class="msub">histórico</div></div></div>'));
    /* Resumen por titular: qué recibió cada persona, cuánto se quedó de

      }).sort((a,b)=>b.s.saldo-a.s.saldo);

          '<td><div style="display:flex;align-items:center;gap:9px">'+av(f.w.titular,'s',1)+
          '<strong>'+esc(f.w.titular)+'</strong></div></td>'+
          '<td>'+esc(f.w.nombre)+'</td>'+
          '<td class="n" style="text-align:right">'+money(f.bruto)+'</td>'+
          '<td class="n" style="text-align:right;color:var(--amb)">'+money(f.s.comisiones)+

        '<td class="n" style="text-align:right;font-weight:700;color:var(--amb)">'+money(r2(tot.com))+'</td>'+

        '</tbody></table></div>';

    const g=document.createElement('div');g.className='grid';
    S.metodos.forEach((w,i)=>{
      const s=saldoWallet(w.id);
      const col=w.color||WCOL[i%WCOL.length];

        '<div style="text-align:right"><div class="enote">entró '+money(s.entradas)+'</div><div class="enote">salió '+money(s.salidas)+'</div></div></div>';
      card.onclick=()=>{S.mWallet=w.id;render()};
      g.appendChild(card);

    v.appendChild(g);

  document.getElementById('nw').onclick=()=>{S.mWallet='new';render()};

      '<td class="ta"><button class="ib" data-cmp="'+p.id+'" title="Comprobante"><i class="ti ti-file-download"></i></button><button class="ib dg" data-dp="'+p.id+'"><i class="ti ti-trash"></i></button></td></tr>').join('')+'</tbody></table>'

function vNomina(v){
  const yr=S.nomYear;
  const qs=quincenasAnio(yr);
  const t=today();
  const cur=qs.find(q=>t>=q.inicio&&t<=q.fin);
  if(!S.nomQ)S.nomQ=(cur||qs[0]).key;
  const q=qs.find(x=>x.key===S.nomQ)||qs[0];
  head(v,'Equipo','Nómina','Las 24 quincenas del año. El control financiero comienza en '+labelQ(qActualGlobal())+' '+qActualGlobal().year+'. Los períodos anteriores quedan solo como histórico.',
    '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><button class="b bg bs" id="reset-control"><i class="ti ti-refresh"></i>Reiniciar control</button><button class="b bg bs" id="y-"><i class="ti ti-chevron-left"></i></button><span class="mono" style="font-weight:600;font-size:15px">'+yr+'</span><button class="b bg bs" id="y+"><i class="ti ti-chevron-right"></i></button></div>');

  const inicioNote=document.createElement('div');inicioNote.className='nomina-start-note';inicioNote.innerHTML='<strong>Control activo desde '+esc(fechaInicioControl()||qActualGlobal().inicio)+'</strong> · Los movimientos anteriores se conservan como histórico, pero quedan fuera de los cálculos actuales. Usa <strong>Reiniciar control</strong> para comenzar un nuevo ciclo.';v.appendChild(inicioNote);

  // Selector de quincenas agrupado por mes
  const gc=document.createElement('div');gc.className='card';
  gc.innerHTML='<div class="ctitle">Quincenas de '+yr+'<span class="cnt">clic para elegir</span></div>';
  const M=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const acc=document.createElement('div');acc.className='acc';
  for(let mi=0;mi<12;mi++){
    const par=qs.filter(x=>x.mes===mi+1);
    const nm=par.map(x=>calcularNomina(x));
    const tot=r2(nm.reduce((s,n)=>s+n.totales.pagable,0));
    const pag=r2(nm.reduce((s,n)=>s+n.totales.yaPagado,0));
    const abierto=par.some(x=>x.key===q.key);
    const est=tot>0&&pag>=tot-0.01?'ok':pag>0?'mid':'';
    const it=document.createElement('div');it.className='accit'+(abierto?' open':'');
    it.innerHTML='<button class="acchd" type="button"><i class="ti ti-chevron-right chev"></i>'+
      '<span class="accm">'+M[mi]+'</span>'+
      (tot>0?'<span class="p '+(est==='ok'?'p-ok':est==='mid'?'p-w':'p-g')+'">'+(est==='ok'?'Pagada':est==='mid'?'Parcial':'Pendiente')+'</span>':'')+
      '<span class="accv mono">'+(tot>0?money(tot):'—')+'</span></button>'+
      '<div class="accbd">'+par.map(x=>{
        const n=calcularNomina(x);
        const on=x.key===q.key;
        return '<button class="qopt'+(on?' on':'')+'" data-q="'+x.key+'" type="button">'+
          '<span>'+(x.mitad===1?'1ª · 1 al 15':'2ª · 16 al '+x.fin.slice(8))+'</span>'+
          '<span class="mono">'+(n.totales.pagable>0?money(n.totales.pagable):'—')+'</span></button>'}).join('')+'</div>';
    acc.appendChild(it);
  }
  gc.appendChild(acc);v.appendChild(gc);
  acc.querySelectorAll('.acchd').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  acc.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.nomQ=b.dataset.q;render()});

  // Quincena seleccionada
  const nom=calcularNomina(q);
  const dc=document.createElement('div');dc.className='card';
  dc.innerHTML='<div class="ctitle">'+labelQ(q)+' de '+yr+'<span class="cnt">'+q.inicio+' → '+q.fin+'</span></div>'+
    '<div class="mets" style="margin-bottom:16px">'+
    '<div class="met"><div class="mlab">Devengado</div><div class="mval">'+money(nom.totales.devengado)+'</div></div>'+
    '<div class="met"><div class="mlab">Pagable ahora</div><div class="mval">'+money(nom.totales.pagable)+'</div></div>'+
    '<div class="met"><div class="mlab">Retenido</div><div class="mval" style="color:var(--amb)">'+money(nom.totales.retenido)+'</div></div>'+
    '<div class="met"><div class="mlab">Falta pagar</div><div class="mval" style="color:var(--pink)">'+money(nom.totales.porPagar)+'</div></div></div>';
  if(!nom.porMiembro.length)dc.innerHTML+=mt('ti-users','Agrega miembros al equipo.');
  nom.porMiembro.forEach(pm=>{
    const box=document.createElement('div');box.className='ndet';
    box.innerHTML='<div class="nhd">'+
      '<i class="ti ti-chevron-right chev2"></i>'+av(pm.nombre,'s',1)+
      '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">'+esc(pm.nombre)+'</div>'+
      '<div style="font-size:11.5px;color:var(--tx3)">'+pm.numClientes+' cliente'+(pm.numClientes===1?'':'s')+
      (pm.sueldoBase>0?' · sueldo '+money(pm.sueldoBase):'')+(pm.retenido>0?' · <span style="color:var(--amb)">'+money(pm.retenido)+' retenido</span>':'')+'</div></div>'+
      '<div style="text-align:right"><div class="mono" style="font-weight:600;font-size:15px">'+money(pm.porPagar)+'</div>'+
      (pm.yaPagado>0?'<div style="font-size:11px;color:var(--tx3)">pagado '+money(pm.yaPagado)+'</div>':'')+'</div>'+
      (qPermitida(q.key)&&(pm.porPagar>0.005||pm.sueldoBase>0||pm.detalle.some(d=>r2((Number(d.montoQuincena)||0)-(Number(d.yaPagadoCliente)||0))>0.005))?'<button class="b bp bs" data-pay="'+pm.memberId+'">Pagar</button>':(!qPermitida(q.key)?'<span class="p p-g">Histórico</span>':'<span class="p p-ok">Al día</span>'))+'</div>';
    if(pm.detalle.length){
      const bd=document.createElement('div');bd.className='nbody';
      bd.innerHTML='<table class="t" style="font-size:12.5px"><thead><tr><th>Cliente</th><th>Estado</th><th>Se paga</th><th></th></tr></thead><tbody>'+
        pm.detalle.map(d=>'<tr><td>'+esc(d.negocio)+'</td>'+
        '<td>'+(d.clientePago?'<span class="p p-ok">cobrado</span>':'<span class="p p-w">sin cobrar</span>')+
        (d.adelanto?' <span class="p p-i">adelanto '+pct(d.adelanto.pct)+'</span>':'')+'</td>'+
        '<td class="n">'+money(d.pagable)+'</td>'+
        '<td class="ta"><button class="b bg bs" data-editpay="'+pm.memberId+'|'+d.companyId+'">Editar</button></td></tr>').join('')+
        '</tbody></table>';
      box.appendChild(bd);
    }
    dc.appendChild(box);
  });
  v.appendChild(dc);

  document.getElementById('reset-control').onclick=()=>reiniciarControlFinancieroModal();
  document.getElementById('y-').onclick=()=>{S.nomYear--;S.nomQ=null;render()};
  document.getElementById('y+').onclick=()=>{S.nomYear++;S.nomQ=null;render()};
  dc.querySelectorAll('.nhd').forEach(h=>h.onclick=e=>{
    if(e.target.closest('button')&&e.target.closest('[data-pay]'))return;
    h.parentElement.classList.toggle('open')});
  dc.querySelectorAll('[data-pay]').forEach(b=>b.onclick=e=>{e.stopPropagation();payModal(b.dataset.pay,q)});
  dc.querySelectorAll('[data-editpay]').forEach(b=>b.onclick=e=>{e.stopPropagation();editClientPayModal(b.dataset.editpay,q)});
}

function configurarInicioNominaModal(){

    const qBase=r2(Number(c.tarifaBruta||0)*0.5);

    return '<div class="assoc" style="cursor:default;flex-wrap:wrap">'+av(c.negocio,'s',0,c.foto)+
      '<div class="ai" style="min-width:220px"><div class="an">'+esc(c.negocio)+'</div><div class="as">'+(c.frecuencia==='quincenal'?'Quincenal':'Mensual')+' · esta quincena corresponde '+money(qBase)+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-left:auto"><label style="font-size:11px;color:var(--tx3)">Ya cubierto antes</label><input class="start-cover" data-cid="'+c.id+'" type="number" min="0" max="'+qBase.toFixed(2)+'" step="0.01" value="'+v.toFixed(2)+'" style="width:110px"><span class="mono" style="font-size:11px;color:var(--tx3)">/ '+money(qBase)+'</span></div></div>'

    '<div class="sim"><div class="simrow"><span>Período activo</span><span class="v">'+q0.key+'</span></div><div class="simrow"><span>Histórico anterior</span><span class="v">No genera deudas</span></div></div>'+
    '<p class="sub" style="font-size:12px;margin:14px 0">Aquí puedes cargar únicamente lo que ya estaba cubierto antes de empezar a usar la aplicación. Por ejemplo, si un cliente ya pagó la mensualidad antes de esta quincena, coloca aquí el 50% que corresponde a esta quincena. No se crean cobros históricos; solo se establece el saldo inicial para nómina.</p>'+
    '<div class="card" style="padding:10px 12px">'+(rows||'<div class="empty">No hay clientes activos con tarifa.</div>')+'</div>'+
    '<div class="brow" style="margin-top:14px"><button class="b bp" id="start-save">Guardar saldo inicial</button><button class="b bg" id="start-clear">Limpiar saldos iniciales</button></div>';
  ov.appendChild(md);document.body.appendChild(ov);

  document.getElementById('start-save').onclick=async()=>{
    const qk=q0.key;S.nominaInicioKey=qk;const next={...S.nominaSaldosIniciales};

function editClientPayModal(key,q){
  const[memberId,companyId]=key.split('|'),c=companyById(companyId),m=memberById(memberId);
  if(!c||!m)return;
  const a=(c.asignaciones||[]).find(x=>x.memberId===memberId),activo=!a||a.activo!==false,mensual=a?Number(a.monto)||0:0;
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target===ov){ov.remove();render()}};
  const md=document.createElement('div');md.className='mdl';

    '<p class="sub">Define si este miembro cobra por este cliente y cuánto recibe. El monto es mensual; la nómina lo divide entre las 2 quincenas.</p>'+

    '<div class="f"><label>Por quincena</label><input id="ep-q" type="text" value="'+money(r2(mensual/2))+'" disabled></div></div>'+
    '<div class="brow"><button class="b bp" id="ep-ok">Guardar cambios</button><button class="b bg" id="ep-cancel">Cancelar</button></div>';
  ov.appendChild(md);document.body.appendChild(ov);
  const mo=document.getElementById('ep-mo'),qq=document.getElementById('ep-q');
  mo.oninput=()=>qq.value=money(r2((Number(mo.value)||0)/2));

  document.getElementById('ep-cancel').onclick=()=>{ov.remove();render()};
  document.getElementById('ep-ok').onclick=async()=>{
    const monto=r2(Number(mo.value)||0),on=document.getElementById('ep-on').checked;
    c.asignaciones=c.asignaciones||[];let ix=c.asignaciones.findIndex(x=>x.memberId===memberId);
    if(ix<0){if(on&&monto>0)c.asignaciones.push({memberId,monto,activo:true})}

    await save('companies');ov.remove();toast('Pago por cliente actualizado');render();
  };
}
function payModal(memberId,q){
  const pm=calcularNomina(q).porMiembro.find(x=>x.memberId===memberId);
  const m=memberById(memberId); if(!pm||!m)return;
  const ov=document.createElement('div');ov.className='ov';
  ov.onclick=e=>{if(e.target===ov){ov.remove();render()}};
  const md=document.createElement('div');md.className='mdl wide';
  const rows=pm.detalle.map((d,i)=>{
    const totalDebido=r2(Math.max(0,Number(d.montoQuincena)||0));
    const yaPagado=r2(Math.max(0,Number(d.yaPagadoCliente)||0));
    const maxAdicional=r2(Math.max(0,totalDebido-yaPagado));
    const liberado=r2(Math.min(maxAdicional,Math.max(0,Number(d.ganado)||0)));
    const coberturaInicial=totalDebido>0?r2(((yaPagado+liberado)/totalDebido)*100):0;
    return '<div class="assoc pay-client-row" data-payi="'+i+'" data-total="'+totalDebido.toFixed(2)+'" data-ya-pagado="'+yaPagado.toFixed(2)+'" data-liberado="'+liberado.toFixed(2)+'" style="cursor:default;flex-wrap:wrap">'+
      av(d.negocio,'s',0,(companyById(d.companyId)||{}).foto)+
      '<div class="ai" style="min-width:220px"><div class="an">'+esc(d.negocio)+'</div><div class="as">Le corresponde '+money(totalDebido)+' · cliente cubrió '+pct((d.porcentajeCobrado||0)*100)+' · disponible '+money(liberado)+'</div></div>'+

  const adelPend=adelantosPendientesMiembro(m.id,q.fin);
  md.innerHTML='<div class="mhd"><div class="mid">'+av(m.nombre,'l',1,m.foto)+'<div><div class="mtitle">Pagar a '+esc(m.nombre)+'</div><div class="esub">'+labelQ(q)+' de '+q.year+'</div></div></div><button class="ib" id="x"><i class="ti ti-x"></i></button></div>'+
