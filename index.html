    '<div class="simrow tot"><span>Total en efectivo a pagar</span><span class="v" id="pay-total">'+money(Math.max(0,pm.totalAntesAdelantos-adelPend))+'</span></div></div>'+ 
    '<div class="msec"><div class="mstitle">Qué quieres cubrir de cada cliente</div>'+ 
    '<p class="sub" style="font-size:12px;margin:-4px 0 10px">El porcentaje es el porcentaje total que quieres dejar cubierto para el empleado en esta quincena. Puedes cubrirlo aunque el cliente todavía no haya pagado.</p>'+ 
    (rows||'<div class="empty" style="padding:18px">Este empleado no tiene clientes variables asignados.</div>')+'</div>'+ 
    '<div class="f" style="margin-top:14px"><label>Descontar de adelantos pendientes</label><input id="p-desc-adv" type="number" min="0" step="0.01" value="'+Math.min(adelPend,Math.max(0,pm.totalAntesAdelantos)).toFixed(2)+'"><div class="hint">Puedes descontar todo, una parte o $0. El saldo no descontado sigue pendiente para futuras quincenas.</div></div>'+ 
    '<div class="row" style="margin-top:10px"><div class="f"><label>Total a pagar</label><input id="p-mo" type="number" step="0.01" value="'+Math.max(0,pm.totalAntesAdelantos-adelPend).toFixed(2)+'" readonly></div>'+ 
    '<div class="f"><label>Fecha</label><input id="p-fe" type="date" value="'+today()+'"></div></div>'+ 
    '<div class="f"><label>Sale de la wallet</label><select id="p-wa">'+S.metodos.map(w=>'<option value="'+w.id+'">'+esc(walletLabel(w))+' · saldo '+money(saldoWallet(w.id).saldo)+'</option>').join('')+'</select></div>'+ 
    '<div class="f"><label>Nota</label><input id="p-no" placeholder="Opcional"></div>'+ 
    '<div class="brow"><button class="b bp" id="p-ok">Registrar y generar comprobante</button><button class="b bg" id="p-only">Solo registrar</button></div>';
  ov.appendChild(md);document.body.appendChild(ov);
  const moTotal=document.getElementById('p-mo'),clientRows=[...md.querySelectorAll('.pay-client-row')];
  function clientSum(){return r2(clientRows.reduce((sum,row)=>sum+(Number(row.querySelector('.pay-client-mo').value)||0),0));}
  function syncClientRow(row){
    const pct=row.querySelector('.pay-client-pct'),amt=row.querySelector('.pay-client-mo');
    const total=Number(pct.dataset.total)||0,yaPagado=Number(pct.dataset.yaPagado)||0,liberado=Number(pct.dataset.liberado)||0,max=Number(amt.dataset.max)||0;
    let p=Math.max(0,Math.min(100,Number(pct.value)||0));
    const objetivoTotal=r2(total*p/100);
    const adicional=r2(Math.max(0,Math.min(max,objetivoTotal-yaPagado-liberado)));
    amt.value=adicional.toFixed(2);
  }
  function syncTotal(){
    const sumaClientes=clientSum(),bruto=r2(pm.sueldoPendiente+sumaClientes);
    const adv=Math.max(0,Math.min(adelPend,bruto,Number(document.getElementById('p-desc-adv')?.value)||0));
    const total=r2(Math.max(0,bruto-adv));
    const liberadas=r2(clientRows.reduce((sum,row)=>{const d=pm.detalle[Number(row.dataset.payi)];return sum+Math.min(Number(row.querySelector('.pay-client-mo').value)||0,Number(d.ganado)||0)},0));
    const cubierto=r2(Math.max(0,sumaClientes-liberadas));
    document.getElementById('pay-liberado').textContent=money(liberadas);
    document.getElementById('pay-cubierto').textContent=money(cubierto);
    document.getElementById('pay-adelantos').textContent='−'+money(adv);
    document.getElementById('pay-total').textContent=money(total);moTotal.value=total.toFixed(2);
  }
  clientRows.forEach(row=>{
    row.querySelector('.pay-client-pct').oninput=()=>{syncClientRow(row);syncTotal()};
    row.querySelector('.pay-client-mo').oninput=()=>{
      const amt=row.querySelector('.pay-client-mo'),pct=row.querySelector('.pay-client-pct'),max=Number(amt.dataset.max)||0,total=Number(pct.dataset.total)||0,ya=Number(pct.dataset.yaPagado)||0;
      const a=Math.max(0,Math.min(max,Number(amt.value)||0));amt.value=a.toFixed(2);pct.value=total>0?r2(((ya+a)/total)*100).toFixed(2):'0.00';syncTotal();
    };
  });
  syncTotal();document.getElementById('p-desc-adv').oninput=syncTotal;document.getElementById('x').onclick=()=>{ov.remove();render()};
  async function doPay(gen){
    const detalle=pm.detalle.map((d,i)=>{const row=clientRows[i];const maxSel=Number(row?.querySelector('.pay-client-mo')?.dataset.max)||0;const montoSel=row?Math.max(0,Math.min(maxSel,Number(row.querySelector('.pay-client-mo').value)||0)):0;return{companyId:d.companyId,negocio:d.negocio,monto:d.montoQuincena,pagable:r2(montoSel),liberado:r2(d.ganado),retenido:r2(Math.max(0,d.montoQuincena-d.yaPagadoCliente-montoSel)),cobrado:d.clientePago,coberturaManual:r2(Math.max(0,montoSel-(Number(d.ganado)||0)))};}).filter(d=>d.pagable>0||d.coberturaManual>0);
    const sumaClientes=r2(detalle.reduce((s,d)=>s+d.pagable,0));
    const bruto=r2(pm.sueldoPendiente+sumaClientes);
    const solicitadoAdv=Math.max(0,Math.min(adelPend,bruto,Number(document.getElementById('p-desc-adv')?.value)||0));
    const plan=solicitadoAdv>0?distribuirDescuentoAdelantos(memberId,document.getElementById('p-fe').value||today(),solicitadoAdv):{aplicados:[],descontado:0,restante:0};
    const total=r2(Math.max(0,bruto-plan.descontado));
    if(total<=0&&plan.descontado<=0){alert('No hay monto para pagar.');return}
    const walletId=(document.getElementById('p-wa')||{}).value||null;
    if(!walletId){alert('Selecciona la wallet desde donde saldrá el pago.');return}
    const sw=saldoWallet(walletId);if(total>sw.saldo+0.005){alert('La wallet no tiene saldo suficiente. Disponible: '+money(sw.saldo));return}
    const p={id:uid(),memberId,quincenaKey:q.key,monto:total,fecha:document.getElementById('p-fe').value||today(),tipo:'pago',general:false,descuentoAdelantos:plan.descontado>0,adelantosDescontados:plan.descontado,advanceAplicados:plan.aplicados,nota:document.getElementById('p-no').value.trim(),walletId,detalle,sueldoBase:pm.sueldoPendiente};
    S.payouts.push(p);await save('payouts');ov.remove();toast('Pago registrado');if(gen)comprobantePDF(p);render();
  }
  document.getElementById('p-ok').onclick=()=>doPay(true);document.getElementById('p-only').onclick=()=>doPay(false);
}

/* ─────────── PAGOS AL EQUIPO ─────────── */
function deudasEquipo(){
  const hoy=today(),resultado=[];
  S.companies.filter(c=>c.estado==='activo').forEach(c=>{
    const inicio=c.fechaInicio||hoy.slice(0,8)+'01',y0=Number(inicio.slice(0,4))||Number(hoy.slice(0,4)),y1=Number(hoy.slice(0,4));
    for(let y=y0;y<=y1;y++)quincenasAnio(y).forEach(q=>{
      if(q.inicio>hoy||!qPermitida(q.key))return;
      asigsDe(c).forEach(a=>{
        const esperado=r2(asigDeMiembro(c,a.memberId)*0.5);if(esperado<=0)return;
        const pagos=S.payouts.filter(p=>p.memberId===a.memberId&&p.quincenaKey===q.key&&p.tipo!=='adelanto');
        const pagado=r2(pagos.reduce((sum,p)=>{const d=(p.detalle||[]).find(z=>z.companyId===c.id||z.negocio===c.negocio);return sum+(d?Number(d.pagable)||0:0)},0));
        const deuda=r2(Math.max(0,esperado-pagado));
        if(deuda>0.005){const cb=cobroNominaCliente(c,q),pct=esperado>0?Math.max(0,Math.min(1,cb.totalBruto/(Number(c.tarifaBruta||0)*0.5))):0;resultado.push({memberId:a.memberId,companyId:c.id,negocio:c.negocio,quincenaKey:q.key,periodo:labelQ(q)+' '+q.year,monto:deuda,clientePago:cb.pagado,cobrado:cb.totalBruto,porcentajeCobrado:pct,esperado,pagadoRegular:pagado})}
      })
    })
  });return resultado.sort((a,b)=>b.quincenaKey.localeCompare(a.quincenaKey));
}

function initSearch(){
  const i=document.getElementById('q'),r=document.getElementById('qr');
  i.oninput=()=>{
    const t=i.value.trim().toLowerCase();
    if(!t){r.className='';r.innerHTML='';return}
    /* El buscador solo recorre lo que el usuario tiene permitido ver.
       Antes indexaba toda la base de datos, así que escribiendo unas letras
       aparecían clientes y contactos ajenos. */
    const res=[
      ...visibleCompanies().filter(c=>c.negocio.toLowerCase().includes(t)).slice(0,4).map(c=>({k:'co',id:c.id,l:c.negocio,t:'Empresa'})),
      ...visibleContacts().filter(c=>fullName(c).toLowerCase().includes(t)||(c.email||'').toLowerCase().includes(t)).slice(0,4).map(c=>({k:'ct',id:c.id,l:fullName(c),t:'Contacto'})),
      ...visibleMembers().filter(m=>m.nombre.toLowerCase().includes(t)).slice(0,4).map(m=>({k:'me',id:m.id,l:m.nombre,t:'Equipo'})),
      ...visibleProspects().filter(p=>p.negocio.toLowerCase().includes(t)).slice(0,3).map(p=>({k:'pr',id:p.id,l:p.negocio,t:'Prospecto'}))
    ].slice(0,10);
    r.className='sres';
    r.innerHTML=res.length?res.map(x=>'<div data-k="'+x.k+'" data-i="'+x.id+'">'+av(x.l,'s',x.k!=='co'&&x.k!=='pr')+'<span>'+esc(x.l)+'</span><span class="tg">'+x.t+'</span></div>').join(''):'<div style="color:var(--txi2)">Sin resultados</div>';
    r.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{
      const k=e.dataset.k,id=e.dataset.i;
      if(k==='co'){S.tab='empresas';S.mCompany=id}
      else if(k==='ct'){S.tab='contactos';S.mContact=id}
      else if(k==='me'){S.tab='equipo';S.mMember=id}
      else{S.tab='prospectos';S.mProspect=id}
      i.value='';r.className='';r.innerHTML='';render()});
  };
  i.onblur=()=>setTimeout(()=>{r.className='';r.innerHTML=''},170);
}

async function bootData(authUser){
  /* Las 16 claves se piden a la vez, no una detrás de otra. Antes cada
     una esperaba a que terminara la anterior, así que la carga tardaba
     16 viajes de ida y vuelta al servidor en lugar de uno. */
  let seeded=false;
  await Promise.all([
    ...KEYS.map(async k=>{
      try{const r=await DB.get('pc2_'+k);if(r)S[k]=JSON.parse(r.value)}catch(e){}
    }),
    (async()=>{try{const r=await DB.get('pc2_seed');if(r)seeded=JSON.parse(r.value)}catch(e){}})()
  ]);
  let txReset=false;try{const rr=await DB.get('pc2_tx_reset_v3');txReset=rr?JSON.parse(rr.value):false}catch(e){}
  if(!txReset){S.cobros=[];S.payouts=[];S.adelantos=[];S.entregas=[];S.calendario={};await Promise.all([save('cobros'),save('payouts'),save('adelantos'),save('entregas'),save('calendario')]);await DB.set('pc2_tx_reset_v3',JSON.stringify(true));}
  if(!S.metodos.length){
    S.metodos=[
      {id:uid(),nombre:'Zelle',comisionPct:0,saldoInicial:0,color:'#6FAF3A'},
      {id:uid(),nombre:'Binance',comisionPct:1,saldoInicial:0,color:'#E0952A'},
      {id:uid(),nombre:'PayPal',comisionPct:5,saldoInicial:0,color:'#3BAFD4'},
      {id:uid(),nombre:'Efectivo',comisionPct:0,saldoInicial:0,color:'#7B6BE0'},
      {id:uid(),nombre:'Transferencia',comisionPct:0,saldoInicial:0,color:'#E8467A'}];
    await save('metodos');
  }
  if(!S.roles.length){
    S.roles=[{id:uid(),nombre:'Administrador',permisos:allPerms()},{id:uid(),nombre:'Community Manager',permisos:defaultRolePerms('Community Manager')},{id:uid(),nombre:'Diseñador',permisos:defaultRolePerms('Diseñador')},
      {id:uid(),nombre:'Editor de video',permisos:defaultRolePerms('Editor de video')},{id:uid(),nombre:'Redactor',permisos:defaultRolePerms('Redactor')}];
    await save('roles');
  } else {
    ensureRolePerms();await save('roles');
  }
  if(ensureUsers()){await save('roles');await save('users');}
  if(!Array.isArray(S.gastosFijos))S.gastosFijos=[];
  if(!seeded&&!S.companies.length){
    const zelle=S.metodos[0].id;
    S.companies=SEED.map(([n,m])=>({id:uid(),negocio:n,ubicacion:'La Grita, Táchira',tarifaBruta:m,
      metodoPagoId:zelle,estado:'activo',frecuencia:'mensual',diaCobro:5,
      equipoIds:[],pesos:{},notas:[],fechaInicio:'',ultimaFechaPago:'',proximaFechaPago:''}));
    await save('companies');await DB.set('pc2_seed',JSON.stringify(true));
  }
  /* ─────────── CARGA INICIAL DEL EQUIPO ───────────
     Basado en la hoja PDF adjunta. Solo se cargan nombres/asignaciones
     que se pueden leer claramente; no se inventan filas que el PDF no
     muestra de forma completa. Se ejecuta una sola vez y nunca pisa datos
     existentes del equipo. */
  const PDF_TEAM_SEED=[
    {nombre:'Gabriel',asigs:[
      ['Sara Marmol',32],['Fatness',45.60],['MG Mora',34],['Piloto',34],
      ['The Truck Garden',45.60],['La Preferida',40],['Rafacars',45.60],['Paramo',40],
      ['Pressure Washing',45.60],['Victoria',32],['Mersy',32],['Savica',45.60],['Gustavo',45.60]
    ]},
    {nombre:'Eric',asigs:[
      ['Fatness',45.60],['Alba Pasteles',32],['MG Mora',34],['Piloto',34],['Savica',45.60],
      ['Yeti Ice',40],['Casa Dam',45.60],['La Preferida',40],['Paramo',45.60],['Terraza',32],
      ['Victoria',32],['Mersy',45.60]
    ]},
    {nombre:'Gabriela',asigs:[
      ['Sara Marmol',32],['Fatness',24],['Sancris',34],['The Truck Garden',34],['Paramo',40],
      ['Injury Guardians',40],['La Preferida',40],['Terraza',40],['Victoria',40],['Savica',40]
    ]},
    {nombre:'Seline',asigs:[
      ['Anva Digital Mom',45.60],['MG Mora',32],['Piloto',45.60],['Savica',45.60],
      ['MD Insurance',40],['Casa Dam',45.60],['Rafacars',40]
    ]},
    {nombre:'Angely',asigs:[
      ['Anva Digital Mom',45.60],['BMG',45.60],['Alba Pasteles',24],['Yeti Ice',45.60],
      ['Injury Guardians',45.60],['La Seguridad',45.60]
    ]},
    {nombre:'Milexis',asigs:[
      ['Diamond Blue',45.60],['Sancris',45.60],['Alba Pasteles',24],['MD Insurance',40],
      ['Travieso Multiservices',45.60],['Casa Dam',45.60]
    ]},
    {nombre:'Chiqui',asigs:[
      ['Lond Insurance',45.60],['Alba Pasteles',45.60],['Travieso Multiservices',45.60],
      ['Yeti Ice',45.60],['Mersy',45.60],['Casa Dam',40]
    ]},
    {nombre:'Sara',asigs:[
      ['BMG',80],['Diamond Blue',24],['La Seguridad',45.60],['Fabiola',40],['Pressure Washing',32]
    ]}
  ];
  if(!S.members.length){
    const roleId='';
    const byName=n=>S.companies.find(c=>String(c.negocio||'').trim().toLowerCase()===String(n).trim().toLowerCase());
    /* Clientes que aparecen en la hoja pero no estaban en el catálogo base. */
    ['Mersy','Gustavo'].forEach(n=>{
      if(!byName(n))S.companies.push({id:uid(),negocio:n,ubicacion:'',tarifaBruta:0,metodoPagoId:(S.metodos[0]||{}).id,
        estado:'activo',frecuencia:'mensual',diaCobro:5,equipoIds:[],pesos:{},asignaciones:[],notas:[],fechaInicio:'',ultimaFechaPago:'',proximaFechaPago:''});
    });
    PDF_TEAM_SEED.forEach(t=>{
      const member={id:uid(),nombre:t.nombre,roleId, email:'',telefono:'',activo:true,tipoCompensacion:'porCliente',sueldoMensual:0,foto:'',payouts:[]};
      S.members.push(member);
      t.asigs.forEach(([cn,monto])=>{
        const c=byName(cn);if(!c)return;
        c.asignaciones=Array.isArray(c.asignaciones)?c.asignaciones:[];
        const old=c.asignaciones.find(a=>a.memberId===member.id);
        if(old)old.monto=Number(monto)||0;
        else c.asignaciones.push({memberId:member.id,monto:Number(monto)||0,activo:true});
        c.equipoIds=(c.asignaciones||[]).filter(a=>a.memberId&&a.activo!==false&&Number(a.monto)>0).map(a=>a.memberId);
      });
    });
    await save('members');await save('companies');
    await DB.set('pc2_pdf_team_seeded',JSON.stringify(true));
  }
  if(!S.counter)S.counter=188;
  if(!S.nominaInicioKey){S.nominaInicioKey=qActualGlobal().key;await save('nominaInicioKey');}
  if(!S.nominaSaldosIniciales||typeof S.nominaSaldosIniciales!=='object'){S.nominaSaldosIniciales={};await save('nominaSaldosIniciales');}
  if(!S.controlInicioFecha){S.controlInicioFecha=today();await save('controlInicioFecha');}

  /* Vincula la cuenta de Supabase con un usuario del panel por correo.
     En el primer inicio, la cuenta que entra reclama el registro de administrador. */
  const email=String(authUser.email||'').trim().toLowerCase();
  const byEmail=()=>S.users.find(u=>u.activo!==false&&String(u.email||'').trim().toLowerCase()===email);
  let appUser=byEmail();
  if(!appUser){
    const admin=S.users.find(u=>String(u.usuario||'').trim().toLowerCase()==='admin');
    if(admin&&!admin.email){admin.email=email;await save('users');appUser=admin}
  }
  if(!appUser){S.loading=false;renderUnlinked(authUser.email||'');return}
  S.sessionUserId=appUser.id;
  S.loading=false;initSearch();initNavToggle();render();
}
boot();
})();
</script>

<script id="custom-dropdown-fallback">
(function(){
  function closeAll(except){
    document.querySelectorAll('.ui-select-wrap.open').forEach(function(w){ if(w!==except) w.classList.remove('open'); });
  }
  function enhance(s){
    if(!s || s.disabled || s.multiple || s.size>1) return;
    if(s.closest('.ui-select-wrap')) return;
    var wrap=document.createElement('div');
    wrap.className='ui-select-wrap';
    s.parentNode.insertBefore(wrap,s);
    wrap.appendChild(s);
    s.classList.add('ui-native-select');
    var trigger=document.createElement('button');
    trigger.type='button';
    trigger.className='ui-select-trigger';
    trigger.setAttribute('aria-haspopup','listbox');
    trigger.setAttribute('aria-expanded','false');
    trigger.innerHTML='<span class="ui-select-label"></span><span class="ui-select-chevron" aria-hidden="true"></span>';
    var menu=document.createElement('div');
    menu.className='ui-select-menu';
    menu.setAttribute('role','listbox');
    Array.prototype.forEach.call(s.options,function(opt,i){
      var b=document.createElement('button');
      b.type='button';
      b.className='ui-select-option';
      b.textContent=opt.textContent||opt.text;
      b.disabled=opt.disabled;
      b.setAttribute('role','option');
      b.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        if(b.disabled || s.disabled) return;
        s.selectedIndex=i;
        s.dispatchEvent(new Event('change',{bubbles:true}));
        s.dispatchEvent(new Event('input',{bubbles:true}));
        refresh(); closeAll(null);
      });
      menu.appendChild(b);
    });
    wrap.appendChild(trigger); wrap.appendChild(menu);
    function refresh(){
      var opt=s.options[s.selectedIndex];
      var lab=wrap.querySelector('.ui-select-label');
      if(lab) lab.textContent=opt ? opt.textContent : '';
      Array.prototype.forEach.call(menu.children,function(b,i){b.classList.toggle('selected',i===s.selectedIndex);});
    }
    trigger.addEventListener('click',function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var open=wrap.classList.contains('open');
      closeAll(wrap); wrap.classList.toggle('open',!open);
      trigger.setAttribute('aria-expanded',String(!open));
      refresh();
    });
    s.addEventListener('change',refresh); s.addEventListener('input',refresh);
    refresh();
  }
  function scan(root){
    (root||document).querySelectorAll('select').forEach(enhance);
    if(root && root.matches && root.matches('select')) enhance(root);
  }
  function start(){
    scan(document);
    document.addEventListener('click',function(e){ if(!e.target.closest('.ui-select-wrap')) closeAll(null); });
    var obs=new MutationObserver(function(ms){
      ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,function(n){if(n.nodeType===1) scan(n);});});
    });
    if(document.body) obs.observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
})();
</script>
